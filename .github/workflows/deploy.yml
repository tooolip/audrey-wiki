name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Restore private deployment configuration
        env:
          DEPLOYMENT_CONFIG_JSON: ${{ secrets.DEPLOYMENT_CONFIG_JSON }}
        run: |
          test -n "$DEPLOYMENT_CONFIG_JSON"
          printf '%s' "$DEPLOYMENT_CONFIG_JSON" > deployment.config.json
          node -e 'const mask=v=>{if(typeof v==="string") console.log("::add-mask::"+v); else if(v&&typeof v==="object") Object.values(v).forEach(mask)}; mask(require("./deployment.config.json"))'
      - run: bun run typecheck
      - name: Apply D1 migrations
        run: bunx cf d1 migrations apply "$(node -p 'require("./deployment.config.json").databaseId')"
      - name: Deploy Worker
        run: bunx cf deploy
